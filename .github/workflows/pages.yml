name: Publicar simulador
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:model
      - run: pnpm test:regression
      - run: pnpm test:decision
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:render
      - name: Recuperar último conjunto de preços
        uses: actions/cache@v4
        with:
          path: public/market-prices
          key: market-prices-${{ github.run_id }}
          restore-keys: market-prices-
      - name: Atualizar referências semanais CONAB
        run: pnpm prices:update
      - run: pnpm build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - run: pnpm test:pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
